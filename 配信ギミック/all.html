<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配信ハムPoC</title>
<style>
:root{--bg:#15161c;--panel:#1f2129;--line:#2f323d;--ink:#eceef4;--sub:#b4b8c6;--acc:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:bold 14px "Yu Gothic","Hiragino Sans",Meiryo,sans-serif}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;max-width:1500px;margin:0 auto;padding:12px 16px;height:100vh}
#main{display:flex;flex-direction:column;min-height:0}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
#stage:fullscreen{max-height:none;border-radius:0}
#stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#info{padding:10px 2px 0}
#name{font-size:20px;color:var(--acc)}
#group{font-size:13px;color:var(--sub);font-weight:normal;margin-left:8px}
#desc{margin:4px 0 8px;font:normal 15px/1.6 "Yu Gothic","Hiragino Sans",Meiryo,sans-serif;color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.ctrl button:hover{border-color:var(--acc)}
.ctrl label{color:var(--sub);font-weight:normal;display:flex;align-items:center;gap:4px}
.ctrl .pos{color:var(--sub);font-weight:normal;margin-left:auto}
#side{display:flex;flex-direction:column;min-height:0}
#side .top{font-weight:normal;color:var(--sub);margin-bottom:6px;line-height:1.6}
#list{position:relative;overflow-y:auto;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 0}
#list h2{font-size:13px;color:var(--sub);margin:10px 12px 2px;position:sticky;top:-4px;background:var(--panel);padding:4px 0}
#list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:normal 14px/1.45 "Yu Gothic","Hiragino Sans",Meiryo,sans-serif;padding:5px 12px;cursor:pointer}
#list button:hover{background:#2a2d38}
#list button.on{background:#3a3220;color:var(--acc);font-weight:bold}
#list button small{color:#8a8fa0;margin-right:6px}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rate span{color:var(--sub);font-weight:normal;margin-right:2px}
.rate button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:5px 12px;font:inherit;cursor:pointer}
.rate button:hover{border-color:var(--acc)}
.rate button.on{background:var(--acc);color:#1a1408;border-color:var(--acc)}
.rate .io{margin-left:auto;display:flex;gap:6px}
.rate .io button{border-radius:8px;font-weight:normal;color:var(--sub)}
#filt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
#filt button{background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font:normal 13px "Yu Gothic","Hiragino Sans",Meiryo,sans-serif;cursor:pointer}
#filt button.on{background:var(--acc);color:#1a1408;border-color:var(--acc);font-weight:bold}
#list button .r{float:right;color:var(--acc);font-size:12px}
#list button.out{display:none}
#list h2.out{display:none}
#none{display:none;color:var(--sub);font-weight:normal;padding:10px 12px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#stage{max-height:none}#list{max-height:60vh}}
</style>
<div id="app">
<div id="main">
<div id="stage"><iframe id="fr" title="演出の見本" allow="fullscreen"></iframe></div>
<div id="info"><div><span id="name"></span><span id="group"></span></div><p id="desc"></p>
<div class="ctrl"><button id="prev">‹ 前へ</button><button id="next">次へ ›</button><button id="full">全画面</button>
<label><input type="checkbox" id="auto" checked> 自動で次へ（15秒）</label><span class="pos" id="pos"></span></div>
<div class="rate" id="rate"><span>評価:</span><button data-r="1">1 いまいち</button><button data-r="2">2 うーん</button><button data-r="3">3 ふつう</button><button data-r="4">4 いい</button><button data-r="5">5 最高</button>
<span class="io"><button id="exp" title="評価をファイルに書き出す">書き出し</button><button id="imp" title="書き出したファイルから評価を読み込む">読み込み</button><input type="file" id="impf" accept=".json,application/json" hidden></span></div></div>
</div>
<div id="side"><div class="top">配信ハムの演出の見本。リストを押すと大きな画面で流れます。← → で前後、F で全画面、1〜5 で評価（0 で取り消し）。評価はこのブラウザに保存されます。<br><a href="ideas500.html">文字だけの演出アイデア500 →</a></div><div id="filt"></div><div id="list"><div id="none">この評価の演出はまだありません。</div></div></div>
</div>
<script>
const G = [["第1弾",[["01_連勝で出世","勝つたびに 通常→サングラス→王冠 と出世。負けると1段階ずつ落ちる。"],["02_破産ハム","王冠から転落し、負けるたびにボロ布→段ボール箱へ。「お恵みを…」"],["03_ハム銀行","キルとデスで架空の所持金が増減。配信の最後に「本日の収支」を発表。"],["04_育つ大剣","キルごとに剣が伸びて天井に届く。デスするとポッキリ折れる。"],["06_魂抜けハム","デスすると白目になって魂が抜ける。2回目は画面の上まで昇天。"],["07_マッチング待ち","待ち時間が長いと 居眠り→鼻ちょうちん→蜘蛛の巣。マッチ成立で飛び起きる。"],["08_離席の代打","離席中はハムが席に座ってコントローラーをガチャガチャ。「勝手にウルト撃った」"],["09_ウルトカットイン","ウルトの瞬間、帯と一緒にキリッとした顔が飛び込む。「本気、出す。」"],["11_どっちガチャ","投げ銭で右下のミニ抽選が始まる。大当たりなら全画面の演出。"],["12_種やり","チャットのコマンドで名前付きの種が飛んできて、ハムが食べる。"]]],["第2弾",[["B01_引退会見","やらかすと会見を開いて「引退します」。次の試合で復帰し、引退回数だけ増えていく。"],["B11_ヒーローインタビュー","勝つとお立ち台でヒーローインタビュー。1勝目は謙虚、連勝するほど調子に乗り、3連勝で「最高でーす!!」。引退会見と対になる。"],["B02_夜逃げハム","ランクダウンで風呂敷を背負って逃走。「探さないでください」を残し、勝つと戻ってくる。"],["B03_ちゃぶ台返し","ブチギレてゲーム画面ごと投げ飛ばす。裏は和室。我に返って、いそいそ元に戻す。"],["B04_言い訳ハム","デスのたびに札で言い訳。最後は札が巨大な「僕は悪くない!!」だけになる。"],["B05_審査員ハム","プレイに点数札を上げるが基準が謎。ナイス4キルが2点、ただ歩くと10点。"],["B06_予言ハム","試合前に勝敗を予言するが外し続け、水晶玉を隠す。的中率も常に表示。"],["B07_縛りルーレット","負けるとルーレットで次の試合の縛りが決まる。「語尾にハム」など。"],["B08_画面かじり","放置すると画面をかじって穴が広がり、奥に種倉庫が見える。テープで塞いでも、またかじる。"],["B10_地下帝国","配信を重ねるほど地下に部屋が増える。試合の合間に断面図で報告。第365回で国会ができる。"]]],["第3弾 突拍子もない案",[["C01_中の人","背中のチャックが開き、小さいおじさんが出てきて汗を拭く。「暑いっすね」"],["C02_マトリョーシカ","ハムが割れて小さいハムが次々に出てくる。本体は種1粒だった。"],["C03_ペラペラ","横を向くと厚さ0mmの紙。風でめくれた裏面に「ご自由にお取りください」。"],["C04_飼い主の手","巨大な手がハムをつかんで右下を掃除する。戻されたハムは上下逆さま。"],["C05_ムキムキ","ナイスキルで首から下だけボディビルダーに。顔はかわいいまま。"],["C06_重力反転","ハムだけ天井に落ちて、そのまま平然と暮らす。種も上に落ちる。"],["C07_傾く世界","ハムが重くなるほど画面が傾き、キルログや弾数が滑り落ちてくる。"],["C08_時間1万倍","右下だけ時間が爆速で進み、3世代が過ぎる。配信者はまだ1試合目。"],["C09_Tポーズ","突然バグって手足を広げ、無表情で画面を横滑りする。"],["C10_だるまさんがころんだ","配信者がよそ見するたびに近づき、気づくと真ん中で巨大化している。"],["C11_壮大なズームアウト","部屋→街→地球→銀河と引いていくと、全部ハムの頬袋の中だった。"],["C12_天気予報","「明日は全国的に種でしょう」と予報したら、本当に種が降ってくる。"],["C13_通販番組","ハムがハムを売る。何もしません。今ならもう1匹ついてきます。"],["C14_演歌","スモークと紙吹雪の中で熱唱する「右下慕情」。作詞も作曲も涙もハム。"],["C15_デス現場検証","デス地点に規制線とチョークの跡。刑事ハムが犯人を突き止める。"],["C16_突然のエンドロール","負けが決まると急にスタッフロール。監督も主演もハム、配信者は通行人B。"],["C17_打ち切り","3連敗で「俺たちの戦いはこれからだ!!」の最終回に。でも普通に続く。"],["C18_走馬灯","デスのたびにハムの生涯がセピア色で流れる。まだ2週間しか生きていない。"],["C19_異世界転生","デスで転生し、3秒で魔王を倒して、何事もなく右下に帰ってくる。"],["C20_配信者を起訴","連敗で法廷が開かれ、裁判長ハムが判決を下す。懲役1試合。"],["C21_ワイプ逆転","ゲーム画面が右下の小窓に縮み、ハムが画面いっぱいで雑談を始める。"],["C22_入れ子配信","ハムもスマホで配信を始める。画面の中の画面へ、どこまでも入っていく。"],["C23_右下独立宣言","右下がハム共和国として独立。配信者のカーソルも入国拒否される。"],["C24_自演ハム","下手な変装でチャットに現れて配信者を褒める。ヒゲが落ちてバレる。"],["C25_HUD泥棒","弾数やミニマップをひとつずつ盗んで、巣に飾る。"],["C26_請求書","配信の終わりに請求書。出演料、深夜手当、精神的苦痛で合計88万円。"],["C27_ストライキ","ハムの集団が「種を増やせ」と画面の下をデモ行進する。"],["C28_離婚届","妻ハムと子ハム40匹が乗り込んできて、離婚届を突きつける。"],["C29_合体ロボ","5匹が大げさに合体して巨大ロボに。敵がいないのですぐ解散する。"],["C30_ハムを探せ","画面がハムで埋まり、1匹だけ違うハムを視聴者が探す。"]]],["第4弾 OWのプレイから",[["D01_ペイロード押し","種を山積みにしたトロッコを押して進む。届いた巨大な種は頬袋に入らない。"],["D02_オーバータイム","右下から動けないので、体をお餅のように伸ばして占拠ポイントに触り続ける。"],["D03_POTG横取り","プレイ・オブ・ザ・ゲームがハムに。種を1粒食べるだけの映像を3アングルで流す。"],["D04_キルカムに映り込む","やられた時のキルカムに、ピースや小旗やうちわで毎回映り込む。"],["D05_勲章まみれ","推薦が届くたびに勲章が増え、最後は重さで前に倒れる。"],["D06_リスポーン体操","復活までの10秒でラジオ体操。配信者が戻っても「第二」を始めようとする。"],["D07_ピン連打","配信者のピンをまねて、画面じゅうに「種」「天井」などのピンを刺しまくる。"],["D08_自分だけシールド","敵のウルトを、ペットボトルのキャップで自分だけ防ぐ。配信者はデス。"],["D09_ウルト発電","回し車でウルトゲージを100%までためるが、使う前に配信者がデス。"],["D10_ロール着せ替え","タンク・ダメージ・サポートに早着替え。4つ目の「ハム」ロールは種を食べるだけ。"],["D11_赤い点","スナイパーのレーザーの点から逃げ回る。点は最後に配信者の頭へ。"],["D12_お辞儀合戦","GGのあと、敵チームのハムとお辞儀の深さで張り合い、2匹とも床にめり込む。"],["D13_低画質モード","Pingが上がるほどハムだけ画質が落ち、最後は灰色の1ドットに。"],["D14_出前","試合中に出前のハムがスクーターで到着。ラーメン代は配信者もち。"],["D15_スプレー落書き","キルのたびにハムの顔のスプレーを壁に貼る。最後は「ハム参上」。"],["D16_寝返り","連続デスで赤チームの応援に寝返る。キルを取った瞬間「ずっと信じてた」。"],["D17_息止めクラッチ","1対3の間ずっと息を止めて顔色が変わる。勝った瞬間プハーッと飛んでいく。"],["D18_翻訳字幕","「キュ」のひと鳴きに、何行も続く長い字幕がつく。"],["D19_寝かしつけ","配信の終わりにゲーム画面へ毛布をかけて読み聞かせ。先にハムが寝る。"],["D20_設定いじり","設定画面で「かわいさ」「敵の数」などをいじる。変わったのはハムだけ。"],["D21_電気ショック","デスした配信者に電気ショック。しびれたのはハムで、毛がアフロに。"],["D22_キルログ乗っ取り","キルログがハムの日常で埋まる。配信者のデスの行はなかったことに。"],["D23_地獄耳","耳をパラボラにして足音を探す。正体は配信者のお腹の音。"],["D24_奈落の釣り","崖から落ちた配信者を釣り上げようとして、長靴と魚と敵が釣れる。"],["D25_ありがとうで溶ける","味方に感謝されるたびに照れて溶け、最後は画面下いっぱいの水たまりに。"],["D26_テレポーター事故","テレポーターに乗るたびHUDの上や敵の目の前に出る。最後は種と混ざって帰ってくる。"]]],["第5弾 Fableの案",[["E01_占拠テント","占拠率が上がるたびにテントが完成していく。奪い返されると寝袋のハムだけが残る。"],["E02_心電図ハム","オーバータイムで心電図が速くなる。勝てば波形が♡、負けたら波を手描きしてごまかす。"],["E03_ポップコーン席","POTGを映画館の席で観る。健なら総立ち、敵ならポップコーンを投げて「返金」。"],["E04_見てられない","キルカムを指のすき間から見て、ティッシュを差し出す。即死なら後ろを向く。"],["E05_放置カップ麺","デスのたびにカップ麺を作るが、復活が早くて食べられない。最後に伸びた麺があふれる。"],["E06_階級の重石","昇格するたび頭に階級の石が積まれてつぶれていく。降格すると喜ぶ。"],["E07_5人分の食卓","グループがそろうまで料理を並べて待つ。そろった瞬間、ハムが全部食べている。"],["E08_ウルトドミノ","ウルトが重なるほどドミノが並ぶ。倒れたドミノが最後にハムの種をはじく。"],["E09_フライパン盾","ブロックするほどフライパンがへこみ、最後は平らな皿になって種を盛る。"],["E10_献血カード","デスのたびにスタンプを押し、10個で満了。寄付先は敵チーム。"],["E11_クラッカー","キルのたびにクラッカーが増えて全身まみれに。5キル目は火薬切れで口で「パン」。"],["E12_伝書鳩","チャットの伝言を鳩が届ける。最後は鳩が手紙を先に食べてしまう。"],["E13_くす玉","勝利のくす玉から落ちてきたのは種1粒。垂れ幕の裏に「予算の都合」。"],["E14_賞味期限","ウルトを抱えたまま死ぬと「ULT」の缶詰が期限切れに。捨てるたび「もったいない」が増える。"],["E15_射的屋","ヘッドショットのたびに景品がもらえる。特賞はハムの等身大ぬいぐるみ。"],["E16_手配書","同じ敵に倒されるたび懸賞金が倍に。倒したら、しぶしぶ種を払う。"],["E17_枯れ草","味方が全滅すると西部劇の荒野に。2個目の枯れ草にハムも巻き込まれて転がっていく。"],["E18_お守り棚","連敗するたび縁起物が増えて顔が見えなくなる。勝ったら全部なぎ払う。"],["E19_化粧ハム","視聴者が増えるほど化粧が濃くなり、ドレスまで着る。減ると素顔に戻ってほっとする。"],["E20_ウルト風船","ウルトがたまるほど風船がふくらみ、発動で空へ連れ去られる。パラシュートで帰還。"],["E21_綱引き","チャットの「!左」「!右」でハムが傾き、転げ落ちる。戻ってきて「許さん」。"],["E22_乱戦サウナ","乱戦でキルログが流れるほど右下が熱くなる。スプリンクラー、水風呂で「整った」。"],["E23_偽バトルパス","試合ごとにしょうもない報酬。豪華報酬は「次シーズンの購入権」。"],["E24_偽実績","不名誉な実績が次々に解除され、トロフィーを掲げる。連敗の実績も「あと少し」。"],["E25_今日の日記","配信の終わりに、ひらがなで日記を書いて自分で花丸をつける。"]]],["第6弾 アイデア500から 面白さ4以上",[["T01-01_成敗した家老","毒見役ハム百代目／キル。ハムが敵を倒すと、御膳に毒を盛った家老ザリガニが縄で引っ立てられ「ぐぬぬ」と連行される。"],["T01-08_解毒剤を飲んだ日","毒見役ハム百代目／チャネポ。ハムが解毒剤を飲み干して、毒入りの膳をぺろりと完食、ピンピンして踊る。"],["T02-04_天秤ナイフ","ケーキの切り分け格差／ウルト。巨大ケーキナイフが一刀両断し、ケーキが左右の皿の天秤に落ちる。"],["T02-08_イチゴ引換券の中身","ケーキの切り分け格差／チャネポ。ザリガニが引換券を差し出すと、ハムが虫眼鏡でイチゴを探して、ヘタの先っぽだけを渡す。"],["T03-06_回りすぎてカピカピ","寿司が客の回転寿司／敗北。誰にも取られず回り続けたハムがだんだん乾いて、ひび割れたカピカピになる。"],["T03-10_本日終了、まかない","寿司が客の回転寿司／配信の節目。暖簾が下ろされ、レーンが止まる。"],["T04-04_定価の一瞬","半額シールのハム／ウルト。ハムの全身が光ってシールがすべて吹き飛び、スポットライトの下で「定価 ¥980」の札が輝く。"],["T04-06_蛍の光とカゴ","半額シールのハム／敗北。閉店の「蛍の光」が流れ、客がいなくなる。"],["T04-07_レシートが長い","半額シールのハム／ビッツ。客ザリガニがついにハムをレジに通すが、シールが多すぎてバーコードが読めず、レジが「ピッ…ピッ…」と鳴り続ける。"],["T05-04_ビッグサイズの罠","種の袋がこっそり減る／ウルト。ウルトの瞬間、袋がドーンと巨大化して「ビッグサイズ！」と派手に光る。"],["T05-07_プレミアム版の中身","種の袋がこっそり減る／ビッツ。袋が金ぴかの「プレミアム」版に衣替えして、値段が3倍の札になる。"],["T06-02_休憩カウントダウン","リスポーン即出勤／デス。デスの瞬間に右下へタイムカード機が現れ、ガチャンと「休憩開始(無給)」を打刻する。"],["T06-03_休みすぎでマイナス","リスポーン即出勤／連続デス。デスのたびに給与明細が画面に出て、「休憩控除」の欄が増え続ける。"],["T06-06_労災却下","リスポーン即出勤／敗北。ハムが「労災申請書」を提出し、事由の欄に「死亡」と書く。"],["T06-08_有給は墓の中","リスポーン即出勤／チャネポ。ハムが「有給休暇」の札を掲げて布団に入ると、布団の足元には黒い額縁と墓石が出現する。"],["T07-01_キ","中抜きピラミッド／キル。金色の「キル!」の文字が画面の上からピラミッド型の会社ビルへ落ちていく。"],["T07-02_損害は下へ流れる","中抜きピラミッド／デス。ハムが倒れると、ピラミッドの最上階から「損害賠償」と書かれた請求書が1枚落ちてくる。"],["T07-04_ウルトの使用料","中抜きピラミッド／ウルト。ハムのウルトの光の柱が空へ立ち上がると、ピラミッドの階ごとにザリガニがストローで光を吸い取っていく。"],["T07-05_台座の下のハム","中抜きピラミッド／勝利。ピラミッドの頂上でザリガニ社長がトロフィーを掲げ、下請けたちが拍手係として整列する。"],["T07-09_応援の伝言ゲーム","中抜きピラミッド／ザリガニのチャット。ザリガニの「がんばれ」が吹き出しになってピラミッドを降りていく。"],["T08-02_死亡承認待ち","撃つにも稟議が要る／デス。ハムが倒れかけるが、頭上に「死亡承認待ち」の札が出て空中で止まる。"],["T08-06_負けは差し戻し","撃つにも稟議が要る／敗北。DEFEATの上に「敗北報告書」が重なり、課長が「差し戻し」の判を押して「引き分け」に書き換える。"],["T08-07_種を食べるにも稟議","撃つにも稟議が要る／ビッツ。ビッツで届いた種を口に運ぼうとすると、課長・部長・本部長のハンコ待ちの行列ができる。"],["T09-02_席がありません","AIに席を奪われる／デス。ハムがデスして復活のカウントダウンをしているあいだに、右下のハムの席にロボハムが座っている。"],["T09-10_最終出社日","AIに席を奪われる／配信の節目。ハムが段ボールに、私物の回し車と小さな座布団と種1粒を詰めて、右下からとぼとぼと退出していく。"],["T10-04_コミットしました","横文字だらけの会議／ウルト。ウルトのボタンの横に「コミット」ボタンが現れ、ハム部長が「ウルトをコミットします!」と叫んで押す。"],["T10-10_氷を割るアイスブレイク","横文字だらけの会議／配信の節目。待ち時間にハム部長が「まずアイスブレイクから」と宣言し、巨大な氷のブロックをハンマーで割る。"],["T11-01_請け出し半額分","命を質に入れるハム／キル。キルした瞬間、質札が1枚ぽんと燃えて、ハムのお腹に光る命の玉が戻る。"],["T11-03_質札が首飾り","命を質に入れるハム／連続デス。デスのたびに質札が首からぶら下がり、3枚目で首飾りのように床まで垂れる。"],["T12-03_金庫が閉まらない","胴元ハムは負けない／連続デス。デスのたびにザリガニが焦って追加のベットを積み、金庫のチップが山になる。"],["T12-06_負けたら連帯保証","胴元ハムは負けない／敗北。負けに張って大喜びのザリガニが窓口へ行くと、「ハムが負けたので胴元は払えません」と成金ハムが泣き顔を作る。"],["T12-09_両面ハムのサイコロ","胴元ハムは負けない／ザリガニのチャット。「丁」「半」の札が壺の前に並び、ザリガニたちのコメントが次々に張られる。"],["T13-03_輪郭まで払う","支払いは毛でどうぞ／連続デス。毛が尽きた状態で3回目のデス。"],["T14-03_相続されます","寿命より長いローン／連続デス。完済予定日が西暦3000年を超え、書類の欄外に「ご子孫の方へ」と赤字が足される。"],["T14-10_本日の寿命と残債","寿命より長いローン／配信の節目。終了時に、ハムの寿命の棒グラフと残債の棒グラフが並んで表示される。"],["T15-03_解約理由は必須","解約ボタンが逃げる／連続デス。解約フォームに「解約理由（必須・5000文字）」の欄が出て、ザリガニのカーソルが入力を始める。"],["T15-08_ボタン拡大1pxに1万pt","解約ボタンが逃げる／チャネポ。交換所の景品に「解約ボタンの大きさ +1px：10,000pt」が並ぶ。"],["T15-10_解約はお電話で","解約ボタンが逃げる／配信の節目。ようやく解約ボタンが押せた瞬間、画面に「解約はお電話で」と表示される。"],["T16-02_手術中ランプ点灯","手術中ランプ点灯／デス。ハムが倒れると右下に赤い「手術中」ランプが点き、リスポーンのカウントが手術時間として進む。"],["T16-06_手術成功率100","手術中ランプ点灯／敗北。敗北画面の上に「本日の手術成功率 100%」の横断幕が掲げられ、医者ザリガニが胸を張る。"],["T17-02_軽微な有害事象","謝礼が種1粒の治験／デス。ハムが倒れると、製薬ザリガニが報告書に「軽微な有害事象」と記入する。"],["T17-04_一気飲みでネオン","謝礼が種1粒の治験／ウルト。ウルトゲージが満タンの瞬間、ハムがビーカーの新薬を一気飲みする。"],["T19-04_レントゲンに映る","健康診断オールE判定／ウルト。ウルトの瞬間、ハムの胸のレントゲン写真が光る。"],["T19-08_再検査はE−","健康診断オールE判定／チャネポ。再検査券を使うと、ハムがもう一度検査台に上がる。"],["T19-10_原因は、あれです","健康診断オールE判定／配信の節目。配信の終わりに、医者ザリガニが「原因に心当たりは？」と尋ねる。"],["T20-06_心にも湿布","とりあえず湿布出します／敗北。敗北したハムが胸を押さえてうなだれると、医者が心臓のあたりに湿布を貼る。"],["T21-02_先読みの2枚","戸籍が長すぎるハム／デス。ハムが落ちる途中で、窓口のザリガニがもう「死亡届」と「出生届」を2枚そろえて差し出している。"],["T21-05_配偶者：種（死別）","戸籍が長すぎるハム／勝利。勝利の喜びのあまり、ハムが種を手に「婚姻届」を窓口に出して受理される。"],["T22-04_爆発に消費税","なんでも課税ハム／ウルト。ウルトの派手な爆発に、ハムが「消費税10%」と書かれたハサミをパチンと入れる。"],["T22-09_草は1本10円","なんでも課税ハム／ザリガニのチャット。チャットに流れる「w」1文字ごとにレジの音が鳴り、「草税」の札が飛ぶ。"],["T23-02_診断書は生存証明が要る","たらい回しの窓口／デス。ハムが倒れたまま死亡届を出すと、「死亡診断書が必要」と言われ、診断書窓口では「生存中のご本人確認が必要」と言われる。"],["T23-08_並ばなくていい券に並ぶ","たらい回しの窓口／チャネポ。チャネポで交換した券を持って窓口に向かうと、案内の矢印は「券専用窓口」に続いていて、そこにも長い行列ができている。"],["T24-05_本人確認で別人","なくした尊厳の遺失届／勝利。勝って「尊厳」を取り戻しに来たハムに、窓口が「本人確認書類を」と要求する。"],["T24-09_目撃証言が全部食い違う","なくした尊厳の遺失届／ザリガニのチャット。チャットで「橋のところで見た」「いや昨日の夜だ」と目撃証言が次々と流れ、画面の地図に赤い点が打たれる。"],["T25-02_自分を印刷して持参","紙で出すオンライン申請／デス。死亡届のオンライン申請に「遺体の確認」として、画面に映った自分を印刷して持参するよう求められる。"],["T26-03_定期券と停留所","あの世行き送迎バス／連続デス。3回目の乗車で運転手が「もう定期にしときます」と顔写真入りのカードを手渡し、改札はハムの顔を見ただけで勝手に開く。"],["T26-08_片道の回数券","あの世行き送迎バス／チャネポ。ハムが11枚つづりの回数券を握りしめ、「10回乗ると1回おまけ」の看板に大喜びする。"],["T26-10_終バスの敬礼","あの世行き送迎バス／配信の節目。終バスの車内でハムが「ハム前」の停留所で降りると、運転手ザリガニが帽子を取って敬礼し「お疲れさまでした、また明日」。"],["T27-07_足置きに昇格","雲のグレードは課金制／ビッツ。ビッツの額が届くたび、ハムの目の前に梯子が1段伸び、必死によじ登る。"],["T28-02_冷蔵庫の手柄","ザリガニの召喚儀式／デス。ハムが敵に倒される寸前、頭上から冷蔵庫が降ってきてぺしゃんこになる。"],["T28-03_家電から一軒家","ザリガニの召喚儀式／連続デス。儀式の失敗が続くたびに降る物が大きくなり、タワシ、冷蔵庫、洗濯機と積み上がり、ついに一軒家が降ってきてハムに被さる。"],["T29-02_最期の一瞬を撮影","遺影がいつも変顔／デス。キルカムの最後の1コマでフラッシュが光り、倒れる瞬間の白目とヨダレの変顔が凍結する。"],["T29-06_通夜で肩が震える","遺影がいつも変顔／敗北。敗北後の通夜の会場に、ザリガニの参列者が並ぶ。"],["T30-04_指が7本","本物なのに加工扱い／ウルト。ウルトで背後霊の軍団を呼び出すと、チャットから「AI生成乙」「指が7本ある」と指摘が来る。"],["T30-08_お祓いが効いた","本物なのに加工扱い／チャネポ。ザリガニが種を撒いてお祓いをすると、本物の幽霊ハムが本当に薄くなって消えかかる。"],["T31-01_連鎖の頂点のはず","食物連鎖ぐるぐる／キル。倒した敵が矢印に乗って「ごちそう」としてハムの口へ運ばれ、食物連鎖図の「ハム」の上に王冠がのる。"],["T31-05_胴上げが食卓","食物連鎖ぐるぐる／勝利。勝利を祝ってザリガニたちがハムを胴上げする。"],["T32-03_宿主がどんどん縮む","共生という名の寄生／連続デス。乗り換えるたびに宿主が小さくなっていき、図鑑の「宿主の変遷」欄にザリガニ、小ザリガニ、エビ、ミジンコと並ぶ。"],["T33-05_ご先祖さま全員","進化の果てはザリガニ／勝利。勝利の表彰式でハムの家系図が映し出される。"],["T33-10_脱皮して帰宅","進化の果てはザリガニ／配信の節目。終わりのあいさつの最中に、ハムが背中をぱかっと割って脱皮し、殻だけを置いて帰っていく。"],["T34-05_旗が場所をとる","縄張りが足の裏だけ／勝利。勝利の記念に旗を立てるが、旗の根元が足の裏の土地を丸ごと占めてしまう。"],["T35-02_外来種はこっち","駆除報奨金で養殖／デス。ハムが外来種と間違われて網で捕まり、ザリガニが報奨金の札束を数えて「ご協力感謝」と頭を下げる。"],["T35-06_帳簿が合わない","駆除報奨金で養殖／敗北。会計監査のザリガニが現れ、「駆除数」と「池の在庫」が両方とも増えている帳簿に首をかしげる。"],["T35-09_在庫No.37","駆除報奨金で養殖／ザリガニのチャット。コマンドを打ったザリガニのアイコンが網で捕獲され、裏の池の札に入れ替わる。"],["T36-07_発掘が雑すぎる","化石になって発掘／ビッツ。投げ銭の額に応じて発掘隊が筆→スコップ→重機にグレードアップする。"],["T37-02_空室になりました","シェルターは1名様／デス。ハムが倒れると扉の表示が「1/1」から「0/1」に変わり、外のザリガニが大喜びで殺到する。"],["T37-03_工期が間に合わない","シェルターは1名様／連続デス。デスのたびに工事が早回しになり、現場監督ザリガニが「納期が！」と叫びながら壁を塗る。"],["T37-05_空気はザリガニ製","シェルターは1名様／勝利。勝利でハムが入室し、玄関でザリガニ執事に靴を揃えてもらう。"],["T37-07_感謝プレートは内側","シェルターは1名様／ビッツ。投げ銭がレンガに変わって壁に積まれ、ご提供者の名前がプレートに刻まれる。"],["T37-09_定員3名の中身","シェルターは1名様／ザリガニのチャット。コマンドのたびに扉の「定員1名」が2、3、5と書き換わっていく。"],["T38-02_ハム、燃えるゴミ","滅亡しても分別厳守／デス。ハムの頭上に「燃えるゴミ」の札がつき、ごみ袋に入れられて収集所に出される。"],["T38-06_隕石は不燃です","滅亡しても分別厳守／敗北。空から隕石が降ってきて画面が真っ赤になる。"],["T39-02_ペンキ臭い","ゾンビにすらスルー／デス。デスしたハムは自分から緑のペンキを顔に塗り、ゾンビになりきって列に並ぶ。"],["T39-06_海のように割れる","ゾンビにすらスルー／敗北。ハムがゾンビの群れに「食べて！」と自ら飛び込むと、群れが海のように割れて道ができる。"],["T39-08_パセリのハム","ゾンビにすらスルー／チャネポ。ゾンビのビュッフェ会場で、ザリガニがメインの大皿に盛られ、ハムは飾りのパセリ代わりに添えられる。"],["T39-10_最後に余るハム","ゾンビにすらスルー／配信の節目。ロビーでゾンビたちがチーム分けをして、ハムだけが最後まで余る。"],["T40-03_陰謀論の赤い糸","終末デマに全力ハム／連続デス。壁一面のコルクボードに前兆の写真が貼られ、ハムが赤い糸で次々つなぐ。"],["T40-06_最後の晩餐、翌朝","終末デマに全力ハム／敗北。ハムが「やはり終わりだ」と備蓄の種を全部出し、ザリガニと最後の晩餐を開く。"],["T41-03_重ね撮りハム祭り","やり直しタイムマシン／連続デス。巻き戻るたびに、過去のハムが消えずに半透明のまま同じ場所に重なっていく。"],["T41-04_戻りすぎた太古","やり直しタイムマシン／ウルト。ウルトを溜め直したいハムが戻りすぎ、年表のダイヤルが億年単位でぐるぐる回って太古の荒野に着く。"],["T41-08_やり直し券の無限","やり直しタイムマシン／チャネポ。ハムがやり直し券を使うと世界が巻き戻り、券を使う前の時点に戻るので券が手元に戻ってくる。"],["T42-04_人間大砲ウルト","本物と量産型の格差／ウルト。王冠ハムが寝そべったままリモコンを押すと、クローン#52が大砲に詰められ、導火線に点火される。"],["T42-06_検品で規格外","本物と量産型の格差／敗北。敗北のあと、クローンたちが一列に並ばされ、王冠ハムが検品ライトを順にあてていく。"],["T42-07_分け前は穴だけ","本物と量産型の格差／ビッツ。降ってきた金貨のうち、金の部分は管を通って王冠ハムの財布に吸い込まれていく。"],["T42-09_本物はどれだ","本物と量産型の格差／ザリガニのチャット。全クローンが一斉に「本物です」の札を上げ、王冠ハムも寝たまま札を上げる。"],["T43-06_負けは箱に隠す","観測で生死が決まる／敗北。ハムが「負けた事実」を箱に詰めて、「観測しなければ負けてない」と押し入れにしまう。"],["T44-02_赤ランプにテープ","忘れられた探査機ハム／デス。探査機が岩に潰されて「通信途絶」の赤ランプが管制室で光る。"],["T44-04_流れ星と願い事","忘れられた探査機ハム／ウルト。ハムが全力のウルトを地球に向けて発射し、長い光の筋が宇宙を渡る。"],["T44-07_小包は解雇通知","忘れられた探査機ハム／ビッツ。投げ銭の金貨が小包になり、パラシュートで探査機ハムのそばに着陸する。"],["T45-07_縦軸も横軸もビッツ","サンプル1匹の大発見／ビッツ。ハムが「ビッツと発見数は完全に相関している」と、ぴったり一直線のグラフを発表する。"],["T45-10_離席中は勝率100","サンプル1匹の大発見／配信の節目。ハムが離席前後の勝率を比べるグラフを発表し、「離席中の勝率は100%」と得意げに示す。"],["T46-05_死亡演技賞","死に役専門俳優ハム／勝利。授賞式のスポットライトの下、「最優秀死亡演技賞はハム！」と発表される。"],["T47-06_切りくず拾い","名場面の切り売り屋台／敗北。屋台の足元に、切り取った残りのフィルムくずが山になっている。"],["T47-08_本家の屋台は閑古鳥","名場面の切り売り屋台／チャネポ。ハムが自分の屋台を出し「公式・本人提供」と看板を掲げるが、客のザリガニは全員隣の切り抜き屋台に流れる。"],["T47-09_本人ごと切り抜き","名場面の切り売り屋台／ザリガニのチャット。画面にハムの輪郭の点線が現れ、ザリガニ職人がチョキチョキと本人を切り抜く。"],["T48-03_謝罪が油になる","息をするだけで炎上／連続デス。炎上したハムが謝罪文を読み上げると、紙から油が吹き出して火が余計に大きくなる。"],["T48-08_凍結（アカウント）","息をするだけで炎上／チャネポ。耐火スーツを着るとすべての火が一瞬で氷になり、ハムはスケートのように滑って転ぶ。"],["T49-03_営業先ダウン三段","一発屋ハムの営業／連続デス。1回目のデスでドームの客席がデパートの屋上に変わり、2回目で公民館に、3回目で公園のベンチに背景が落ちる。"],["T49-05_拍手じゃなく蚊","一発屋ハムの営業／勝利。勝利のあと、ハムがギャグを決めると、客席のザリガニが「パチン」と手を叩く。"],["T49-09_客が先に言う","一発屋ハムの営業／ザリガニのチャット。ハムが決めギャグの構えをとると、客席のザリガニが先に「ぱんぱんぱーん！」と全部言ってしまう。"],["T50-02_瀕死のロゴ向け","バレバレのステマ／デス。倒れたハムが死にかけの声で「このおがくずさえあれば…」と呟く。"],["T50-06_泣きながら宣伝","バレバレのステマ／敗北。負けて号泣するハムの後ろから、ザリガニ社長がカンペを出す。"]]],["演出メニューの見せ方 ビッツ・チャネポ",[["M05_看板で紹介","右下のハムが看板を掲げ、演出と値段を1つずつ紹介する。見本は2秒ごと（本番は9秒ごと）。"],["M06_吹き出しで宣伝","2〜3分に1回、ハムが値段つきでぼそっとつぶやく。見本は間を短くしている。"],["M07_上の帯","一番上の細い帯に、ビッツのページとチャネポのページを5秒ごとに切り替えて出す。OWの目標表示はあけてある。"],["M08_試合中と合間","試合中は左上に小さなタブだけ。リスポーン待ちやマッチング待ちでは、真ん中に自販機風の大きなメニュー。"],["M09_発動中と順番待ち","右の中段に、いま発動中の演出と順番待ち。同じ人の同じ演出は「×3」にまとめ、終わるたびにハムがお礼を言う。"],["M10_みんなで貯めるゲージ","みんなのビッツで左上のゲージが貯まり、満タンで合体ロボが発動する。"],["M11_ボードをめくって紹介","ハムが胸の前でボードを持ち、めくるたびに金と銀の飾りで値段と演出名が出る。見本は2秒ごと（本番は9秒ごと）。"],["M12_黒板とチョーク","木の枠の小さな黒板に、チョークで値段と演出名を書いていく。次へ行く前に黒板消しでこすって消す。"],["M13_スケッチブック","リングとじのスケッチブックをずっと胸の前に持ち、ページを上にめくって7つの演出を順に紹介し続ける。マーカーの手書き。"],["M14_木の札と焼印","木の札に、焼きごてで演出名をジュッと焼き付け、赤いハンコで値段をポン。札を回して次へ。"],["M15_ぷっくりシール","パステルのボードに、ぷっくりしたシールで演出名を1文字ずつ貼る。値段は丸いバッジ。はがして次へ。"],["M16_紙芝居","木の紙芝居の枠。演出名と絵の入った札を、横にシュッと引き抜いて次の演出へ。"]]]];

function rate(n) { if (cur < 0) return; const f = all[cur].f; if (!n || R[f] === n) delete R[f]; else R[f] = n; saveR(); paint(); }
// 絞り込みの中で前後へ進む (今の演出が絞り込みの外でも、次は絞り込みの中から)
function step(d) { for (let k = 1; k <= all.length; k++) { const i = (cur + d * k + all.length * 2) % all.length; if (pass(i)) return show(i); } }
function show(i, user) {
  i = (i + all.length) % all.length; if (i === cur) return; cur = i; const it = all[i];
  $("fr").src = it.f + ".html"; $("name").textContent = title(it.f); $("group").textContent = it.g; $("desc").textContent = it.d;
  $("pos").textContent = `${i + 1} / ${all.length}`;
  btns.forEach((b, k) => b.classList.toggle("on", k === i)); paint(); const L = $("list"), b = btns[i]; if (b.offsetTop < L.scrollTop || b.offsetTop > L.scrollTop + L.clientHeight - 40) L.scrollTop = b.offsetTop - L.clientHeight / 2; // 画面全体は動かさない
  history.replaceState(null, "", "#" + encodeURIComponent(it.f)); document.title = title(it.f) + " | 配信ハムPoC";
  arm();
}
function arm() { clearTimeout(timer); if ($("auto").checked) timer = setTimeout(() => step(1), 15000); }
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1); $("auto").onchange = arm;
$("rate").onclick = e => { const b = e.target.closest("button[data-r]"); if (b) rate(+b.dataset.r); };
$("filt").onclick = e => { const b = e.target.closest("button[data-f]"); if (!b) return; F = b.dataset.f; paint(); if (!pass(cur)) step(1); };
$("exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ ratings: R, labels: LABEL.slice(1) }, null, 1)], { type: "application/json" })); a.download = "ham_ratings.json"; a.click(); };
$("imp").onclick = () => $("impf").click();
$("impf").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()), r = d.ratings || d; for (const k in r) if (r[k] >= 1 && r[k] <= 5) R[k] = +r[k]; saveR(); paint(); } catch (err) { alert("読み込めませんでした"); } e.target.value = ""; };
$("full").onclick = () => { const st = $("stage"); document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen && st.requestFullscreen(); };
addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); else if (e.key === "f" || e.key === "F") $("full").click(); else if (/^[0-5]$/.test(e.key)) rate(+e.key); });
// #ページ名 で開いたら、その演出から流す (アイデア集のリンクなど)
const pick = () => { const f = decodeURIComponent(location.hash.slice(1)), i = all.findIndex(x => x.f === f); return i < 0 ? 0 : i; };
addEventListener("hashchange", () => show(pick()));
show(pick());
</script>
