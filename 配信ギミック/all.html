<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配信ハムPoC</title>
<style>
:root{--bg:#15161c;--panel:#1f2129;--line:#2f323d;--ink:#eceef4;--sub:#b4b8c6;--acc:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:bold 14px "Yu Gothic","Hiragino Sans",Meiryo,sans-serif}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;max-width:1500px;margin:0 auto;padding:12px 16px;height:100vh}
#main{display:flex;flex-direction:column;min-height:0}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
#stage:fullscreen{max-height:none;border-radius:0}
#stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#info{padding:10px 2px 0}
#name{font-size:20px;color:var(--acc)}
#group{font-size:13px;color:var(--sub);font-weight:normal;margin-left:8px}
#desc{margin:4px 0 8px;font:normal 15px/1.6 "Yu Gothic","Hiragino Sans",Meiryo,sans-serif;color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.ctrl button:hover{border-color:var(--acc)}
.ctrl label{color:var(--sub);font-weight:normal;display:flex;align-items:center;gap:4px}
.ctrl .pos{color:var(--sub);font-weight:normal;margin-left:auto}
#side{display:flex;flex-direction:column;min-height:0}
#side .top{font-weight:normal;color:var(--sub);margin-bottom:6px;line-height:1.6}
#list{position:relative;overflow-y:auto;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 0}
#list h2{font-size:13px;color:var(--sub);margin:10px 12px 2px;position:sticky;top:-4px;background:var(--panel);padding:4px 0}
#list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:normal 14px/1.45 "Yu Gothic","Hiragino Sans",Meiryo,sans-serif;padding:5px 12px;cursor:pointer}
#list button:hover{background:#2a2d38}
#list button.on{background:#3a3220;color:var(--acc);font-weight:bold}
#list button small{color:#8a8fa0;margin-right:6px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#stage{max-height:none}#list{max-height:60vh}}
</style>
<div id="app">
<div id="main">
<div id="stage"><iframe id="fr" title="演出の見本" allow="fullscreen"></iframe></div>
<div id="info"><div><span id="name"></span><span id="group"></span></div><p id="desc"></p>
<div class="ctrl"><button id="prev">‹ 前へ</button><button id="next">次へ ›</button><button id="full">全画面</button>
<label><input type="checkbox" id="auto" checked> 自動で次へ（15秒）</label><span class="pos" id="pos"></span></div></div>
</div>
<div id="side"><div class="top">配信ハムの演出の見本。リストを押すと大きな画面で流れます。← → で前後、F で全画面。<br><a href="ideas500.html">文字だけの演出アイデア500 →</a></div><div id="list"></div></div>
</div>
<script>
const G = [["第1弾",[["01_連勝で出世","勝つたびに 通常→サングラス→王冠 と出世。負けると1段階ずつ落ちる。"],["02_破産ハム","王冠から転落し、負けるたびにボロ布→段ボール箱へ。「お恵みを…」"],["03_ハム銀行","キルとデスで架空の所持金が増減。配信の最後に「本日の収支」を発表。"],["04_育つ大剣","キルごとに剣が伸びて天井に届く。デスするとポッキリ折れる。"],["06_魂抜けハム","デスすると白目になって魂が抜ける。2回目は画面の上まで昇天。"],["07_マッチング待ち","待ち時間が長いと 居眠り→鼻ちょうちん→蜘蛛の巣。マッチ成立で飛び起きる。"],["08_離席の代打","離席中はハムが席に座ってコントローラーをガチャガチャ。「勝手にウルト撃った」"],["09_ウルトカットイン","ウルトの瞬間、帯と一緒にキリッとした顔が飛び込む。「本気、出す。」"],["11_どっちガチャ","投げ銭で右下のミニ抽選が始まる。大当たりなら全画面の演出。"],["12_種やり","チャットのコマンドで名前付きの種が飛んできて、ハムが食べる。"]]],["第2弾",[["B01_引退会見","やらかすと会見を開いて「引退します」。次の試合で復帰し、引退回数だけ増えていく。"],["B11_ヒーローインタビュー","勝つとお立ち台でヒーローインタビュー。1勝目は謙虚、連勝するほど調子に乗り、3連勝で「最高でーす!!」。引退会見と対になる。"],["B02_夜逃げハム","ランクダウンで風呂敷を背負って逃走。「探さないでください」を残し、勝つと戻ってくる。"],["B03_ちゃぶ台返し","ブチギレてゲーム画面ごと投げ飛ばす。裏は和室。我に返って、いそいそ元に戻す。"],["B04_言い訳ハム","デスのたびに札で言い訳。最後は札が巨大な「僕は悪くない!!」だけになる。"],["B05_審査員ハム","プレイに点数札を上げるが基準が謎。ナイス4キルが2点、ただ歩くと10点。"],["B06_予言ハム","試合前に勝敗を予言するが外し続け、水晶玉を隠す。的中率も常に表示。"],["B07_縛りルーレット","負けるとルーレットで次の試合の縛りが決まる。「語尾にハム」など。"],["B08_画面かじり","放置すると画面をかじって穴が広がり、奥に種倉庫が見える。テープで塞いでも、またかじる。"],["B10_地下帝国","配信を重ねるほど地下に部屋が増える。試合の合間に断面図で報告。第365回で国会ができる。"]]],["第3弾 突拍子もない案",[["C01_中の人","背中のチャックが開き、小さいおじさんが出てきて汗を拭く。「暑いっすね」"],["C02_マトリョーシカ","ハムが割れて小さいハムが次々に出てくる。本体は種1粒だった。"],["C03_ペラペラ","横を向くと厚さ0mmの紙。風でめくれた裏面に「ご自由にお取りください」。"],["C04_飼い主の手","巨大な手がハムをつかんで右下を掃除する。戻されたハムは上下逆さま。"],["C05_ムキムキ","ナイスキルで首から下だけボディビルダーに。顔はかわいいまま。"],["C06_重力反転","ハムだけ天井に落ちて、そのまま平然と暮らす。種も上に落ちる。"],["C07_傾く世界","ハムが重くなるほど画面が傾き、キルログや弾数が滑り落ちてくる。"],["C08_時間1万倍","右下だけ時間が爆速で進み、3世代が過ぎる。配信者はまだ1試合目。"],["C09_Tポーズ","突然バグって手足を広げ、無表情で画面を横滑りする。"],["C10_だるまさんがころんだ","配信者がよそ見するたびに近づき、気づくと真ん中で巨大化している。"],["C11_壮大なズームアウト","部屋→街→地球→銀河と引いていくと、全部ハムの頬袋の中だった。"],["C12_天気予報","「明日は全国的に種でしょう」と予報したら、本当に種が降ってくる。"],["C13_通販番組","ハムがハムを売る。何もしません。今ならもう1匹ついてきます。"],["C14_演歌","スモークと紙吹雪の中で熱唱する「右下慕情」。作詞も作曲も涙もハム。"],["C15_デス現場検証","デス地点に規制線とチョークの跡。刑事ハムが犯人を突き止める。"],["C16_突然のエンドロール","負けが決まると急にスタッフロール。監督も主演もハム、配信者は通行人B。"],["C17_打ち切り","3連敗で「俺たちの戦いはこれからだ!!」の最終回に。でも普通に続く。"],["C18_走馬灯","デスのたびにハムの生涯がセピア色で流れる。まだ2週間しか生きていない。"],["C19_異世界転生","デスで転生し、3秒で魔王を倒して、何事もなく右下に帰ってくる。"],["C20_配信者を起訴","連敗で法廷が開かれ、裁判長ハムが判決を下す。懲役1試合。"],["C21_ワイプ逆転","ゲーム画面が右下の小窓に縮み、ハムが画面いっぱいで雑談を始める。"],["C22_入れ子配信","ハムもスマホで配信を始める。画面の中の画面へ、どこまでも入っていく。"],["C23_右下独立宣言","右下がハム共和国として独立。配信者のカーソルも入国拒否される。"],["C24_自演ハム","下手な変装でチャットに現れて配信者を褒める。ヒゲが落ちてバレる。"],["C25_HUD泥棒","弾数やミニマップをひとつずつ盗んで、巣に飾る。"],["C26_請求書","配信の終わりに請求書。出演料、深夜手当、精神的苦痛で合計88万円。"],["C27_ストライキ","ハムの集団が「種を増やせ」と画面の下をデモ行進する。"],["C28_離婚届","妻ハムと子ハム40匹が乗り込んできて、離婚届を突きつける。"],["C29_合体ロボ","5匹が大げさに合体して巨大ロボに。敵がいないのですぐ解散する。"],["C30_ハムを探せ","画面がハムで埋まり、1匹だけ違うハムを視聴者が探す。"]]],["第4弾 OWのプレイから",[["D01_ペイロード押し","種を山積みにしたトロッコを押して進む。届いた巨大な種は頬袋に入らない。"],["D02_オーバータイム","右下から動けないので、体をお餅のように伸ばして占拠ポイントに触り続ける。"],["D03_POTG横取り","プレイ・オブ・ザ・ゲームがハムに。種を1粒食べるだけの映像を3アングルで流す。"],["D04_キルカムに映り込む","やられた時のキルカムに、ピースや小旗やうちわで毎回映り込む。"],["D05_勲章まみれ","推薦が届くたびに勲章が増え、最後は重さで前に倒れる。"],["D06_リスポーン体操","復活までの10秒でラジオ体操。配信者が戻っても「第二」を始めようとする。"],["D07_ピン連打","配信者のピンをまねて、画面じゅうに「種」「天井」などのピンを刺しまくる。"],["D08_自分だけシールド","敵のウルトを、ペットボトルのキャップで自分だけ防ぐ。配信者はデス。"],["D09_ウルト発電","回し車でウルトゲージを100%までためるが、使う前に配信者がデス。"],["D10_ロール着せ替え","タンク・ダメージ・サポートに早着替え。4つ目の「ハム」ロールは種を食べるだけ。"],["D11_赤い点","スナイパーのレーザーの点から逃げ回る。点は最後に配信者の頭へ。"],["D12_お辞儀合戦","GGのあと、敵チームのハムとお辞儀の深さで張り合い、2匹とも床にめり込む。"],["D13_低画質モード","Pingが上がるほどハムだけ画質が落ち、最後は灰色の1ドットに。"],["D14_出前","試合中に出前のハムがスクーターで到着。ラーメン代は配信者もち。"],["D15_スプレー落書き","キルのたびにハムの顔のスプレーを壁に貼る。最後は「ハム参上」。"],["D16_寝返り","連続デスで赤チームの応援に寝返る。キルを取った瞬間「ずっと信じてた」。"],["D17_息止めクラッチ","1対3の間ずっと息を止めて顔色が変わる。勝った瞬間プハーッと飛んでいく。"],["D18_翻訳字幕","「キュ」のひと鳴きに、何行も続く長い字幕がつく。"],["D19_寝かしつけ","配信の終わりにゲーム画面へ毛布をかけて読み聞かせ。先にハムが寝る。"],["D20_設定いじり","設定画面で「かわいさ」「敵の数」などをいじる。変わったのはハムだけ。"],["D21_電気ショック","デスした配信者に電気ショック。しびれたのはハムで、毛がアフロに。"],["D22_キルログ乗っ取り","キルログがハムの日常で埋まる。配信者のデスの行はなかったことに。"],["D23_地獄耳","耳をパラボラにして足音を探す。正体は配信者のお腹の音。"],["D24_奈落の釣り","崖から落ちた配信者を釣り上げようとして、長靴と魚と敵が釣れる。"],["D25_ありがとうで溶ける","味方に感謝されるたびに照れて溶け、最後は画面下いっぱいの水たまりに。"],["D26_テレポーター事故","テレポーターに乗るたびHUDの上や敵の目の前に出る。最後は種と混ざって帰ってくる。"]]],["第5弾 Fableの案",[["E01_占拠テント","占拠率が上がるたびにテントが完成していく。奪い返されると寝袋のハムだけが残る。"],["E02_心電図ハム","オーバータイムで心電図が速くなる。勝てば波形が♡、負けたら波を手描きしてごまかす。"],["E03_ポップコーン席","POTGを映画館の席で観る。健なら総立ち、敵ならポップコーンを投げて「返金」。"],["E04_見てられない","キルカムを指のすき間から見て、ティッシュを差し出す。即死なら後ろを向く。"],["E05_放置カップ麺","デスのたびにカップ麺を作るが、復活が早くて食べられない。最後に伸びた麺があふれる。"],["E06_階級の重石","昇格するたび頭に階級の石が積まれてつぶれていく。降格すると喜ぶ。"],["E07_5人分の食卓","グループがそろうまで料理を並べて待つ。そろった瞬間、ハムが全部食べている。"],["E08_ウルトドミノ","ウルトが重なるほどドミノが並ぶ。倒れたドミノが最後にハムの種をはじく。"],["E09_フライパン盾","ブロックするほどフライパンがへこみ、最後は平らな皿になって種を盛る。"],["E10_献血カード","デスのたびにスタンプを押し、10個で満了。寄付先は敵チーム。"],["E11_クラッカー","キルのたびにクラッカーが増えて全身まみれに。5キル目は火薬切れで口で「パン」。"],["E12_伝書鳩","チャットの伝言を鳩が届ける。最後は鳩が手紙を先に食べてしまう。"],["E13_くす玉","勝利のくす玉から落ちてきたのは種1粒。垂れ幕の裏に「予算の都合」。"],["E14_賞味期限","ウルトを抱えたまま死ぬと「ULT」の缶詰が期限切れに。捨てるたび「もったいない」が増える。"],["E15_射的屋","ヘッドショットのたびに景品がもらえる。特賞はハムの等身大ぬいぐるみ。"],["E16_手配書","同じ敵に倒されるたび懸賞金が倍に。倒したら、しぶしぶ種を払う。"],["E17_枯れ草","味方が全滅すると西部劇の荒野に。2個目の枯れ草にハムも巻き込まれて転がっていく。"],["E18_お守り棚","連敗するたび縁起物が増えて顔が見えなくなる。勝ったら全部なぎ払う。"],["E19_化粧ハム","視聴者が増えるほど化粧が濃くなり、ドレスまで着る。減ると素顔に戻ってほっとする。"],["E20_ウルト風船","ウルトがたまるほど風船がふくらみ、発動で空へ連れ去られる。パラシュートで帰還。"],["E21_綱引き","チャットの「!左」「!右」でハムが傾き、転げ落ちる。戻ってきて「許さん」。"],["E22_乱戦サウナ","乱戦でキルログが流れるほど右下が熱くなる。スプリンクラー、水風呂で「整った」。"],["E23_偽バトルパス","試合ごとにしょうもない報酬。豪華報酬は「次シーズンの購入権」。"],["E24_偽実績","不名誉な実績が次々に解除され、トロフィーを掲げる。連敗の実績も「あと少し」。"],["E25_今日の日記","配信の終わりに、ひらがなで日記を書いて自分で花丸をつける。"]]],["演出メニューの見せ方 ビッツ・チャネポ",[["M05_看板で紹介","右下のハムが看板を掲げ、演出と値段を1つずつ紹介する。見本は2秒ごと（本番は9秒ごと）。"],["M06_吹き出しで宣伝","2〜3分に1回、ハムが値段つきでぼそっとつぶやく。見本は間を短くしている。"],["M07_上の帯","一番上の細い帯に、ビッツのページとチャネポのページを5秒ごとに切り替えて出す。OWの目標表示はあけてある。"],["M08_試合中と合間","試合中は左上に小さなタブだけ。リスポーン待ちやマッチング待ちでは、真ん中に自販機風の大きなメニュー。"],["M09_発動中と順番待ち","右の中段に、いま発動中の演出と順番待ち。同じ人の同じ演出は「×3」にまとめ、終わるたびにハムがお礼を言う。"],["M10_みんなで貯めるゲージ","みんなのビッツで左上のゲージが貯まり、満タンで合体ロボが発動する。"],["M11_ボードをめくって紹介","ハムが胸の前でボードを持ち、めくるたびに金と銀の飾りで値段と演出名が出る。見本は2秒ごと（本番は9秒ごと）。"],["M12_黒板とチョーク","木の枠の小さな黒板に、チョークで値段と演出名を書いていく。次へ行く前に黒板消しでこすって消す。"],["M13_スケッチブック","リングとじのスケッチブックをずっと胸の前に持ち、ページを上にめくって7つの演出を順に紹介し続ける。マーカーの手書き。"],["M14_木の札と焼印","木の札に、焼きごてで演出名をジュッと焼き付け、赤いハンコで値段をポン。札を回して次へ。"],["M15_ぷっくりシール","パステルのボードに、ぷっくりしたシールで演出名を1文字ずつ貼る。値段は丸いバッジ。はがして次へ。"],["M16_紙芝居","木の紙芝居の枠。演出名と絵の入った札を、横にシュッと引き抜いて次の演出へ。"]]]];
const $ = id => document.getElementById(id), all = G.flatMap(([g, items]) => items.map(([f, d]) => ({ f, d, g }))), btns = [];
const title = f => f.replace("_", " ");
let cur = -1, timer = 0;
// 再生リスト
for (const [g, items] of G) {
  const h = document.createElement("h2"); h.textContent = `${g}（${items.length}個）`; $("list").append(h);
  for (const [f] of items) { const i = btns.length, b = document.createElement("button"); const [id, nm] = [f.split("_")[0], f.slice(f.indexOf("_") + 1)];
    b.innerHTML = `<small>${id}</small>`; b.append(nm); b.onclick = () => show(i, true); $("list").append(b); btns.push(b); }
}
function show(i, user) {
  i = (i + all.length) % all.length; if (i === cur) return; cur = i; const it = all[i];
  $("fr").src = it.f + ".html"; $("name").textContent = title(it.f); $("group").textContent = it.g; $("desc").textContent = it.d;
  $("pos").textContent = `${i + 1} / ${all.length}`;
  btns.forEach((b, k) => b.classList.toggle("on", k === i)); const L = $("list"), b = btns[i]; if (b.offsetTop < L.scrollTop || b.offsetTop > L.scrollTop + L.clientHeight - 40) L.scrollTop = b.offsetTop - L.clientHeight / 2; // 画面全体は動かさない
  history.replaceState(null, "", "#" + encodeURIComponent(it.f)); document.title = title(it.f) + " | 配信ハムPoC";
  arm();
}
function arm() { clearTimeout(timer); if ($("auto").checked) timer = setTimeout(() => show(cur + 1), 15000); }
$("prev").onclick = () => show(cur - 1, true); $("next").onclick = () => show(cur + 1, true); $("auto").onchange = arm;
